name: Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump version and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/build.gradle.kts"
          CURRENT_CODE=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' "$FILE" | head -n1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')

          if [[ -z "$CURRENT_CODE" ]]; then
            echo "Unable to parse current versionCode" >&2
            exit 1
          fi

          NEW_CODE=$((CURRENT_CODE + 1))
          NEW_NAME="v${NEW_CODE}"

          sed -E -i "s/^([[:space:]]*versionCode[[:space:]]*=).*/\1 ${NEW_CODE}/" "$FILE"
          sed -E -i "s/^([[:space:]]*versionName[[:space:]]*=).*/\1 \"${NEW_NAME}\"/" "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          git commit -m "chore: bump version to ${NEW_NAME} [skip ci]"

          git tag "${NEW_NAME}"
          git push origin main
          git push origin "${NEW_NAME}"

          echo "version_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)

          if [[ -z "$APK_PATH" ]]; then
            echo "No APK found in app/build/outputs/apk/release" >&2
            exit 1
          fi

          echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version_name }}
          name: ${{ steps.bump.outputs.version_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
